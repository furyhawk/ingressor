[project]
name = "ingressor"
version = "0.1.0"
description = "Marker PDF/Document to Markdown Converter using Reflex Framework"
readme = "README.md"
authors = [
    { name = "furyhawk", email = "furyx@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "marker-pdf>=2.0.0",
    "reflex>=0.3.0",
    "pypdfium2>=4.0.0",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
ingressor = "ingressor.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
